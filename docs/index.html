<div id="concept-viz-root" style="position: relative; width: 100%; height: 100%; min-height: 500px; overflow: hidden; background: transparent;">
  <canvas id="concept-canvas" style="display: block; width: 100%; height: 100%; pointer-events: auto;"></canvas>
  <script>
  (function() {
    const root = document.getElementById('concept-viz-root');
    const canvas = document.getElementById('concept-canvas');
    const ctx = canvas.getContext('2d');

    // Canvas sizing & DPI state
    let rect = { width: 800, height: 500 };
    let dpr = window.devicePixelRatio || 1;

    // Interactive State
    let state = {
      protocol: 'HTTPS', // 'HTTPS' or 'HTTP'
      payloadIdx: 0,
      payloads: [
        { label: 'Login Pass', raw: 'Pass: secret123' },
        { label: 'Credit Card', raw: 'Card: 4532..8891' },
        { label: 'Health Data', raw: 'Rx: Patient A' }
      ],
      packetPos: 0, // 0 (Client) -> 1 (Server)
      packetDirection: 1, // 1: client -> server, -1: server -> client
      isTransmitting: false,
      hoveredBtn: null,
      selectedKeyType: 'TLS Handshake Key (AES-256)',
      keyExchanged: true,
      lastTimestamp: 0
    };

    // Encryption helper simulation (Caesar / XOR garble simulation)
    function simulateEncrypt(text) {
      let result = '';
      for (let i = 0; i < text.length; i++) {
        const code = text.charCodeAt(i);
        // Simple printable ascii shift garble for visual clarity
        result += String.fromCharCode(33 + ((code * 7 + 13) % 90));
      }
      return result;
    }

    // Bounding Box Collision Engine
    const boxes = [];
    function clearBoxes() {
      boxes.length = 0;
    }
    function registerBox(id, x, y, w, h) {
      boxes.push({ id, x, y, w, h, r: x + w, b: y + h });
    }
    function isOverlapping(x, y, w, h, pad = 12) {
      for (const b of boxes) {
        if (x < b.r + pad && x + w + pad > b.x && y < b.b + pad && y + h + pad > b.y) {
          return true;
        }
      }
      return false;
    }

    // Pseudo-random seedable generator for subtle organic drawing
    function pseudoJitter(seed) {
      const x = Math.sin(seed * 9999) * 10000;
      return (x - Math.floor(x)) - 0.5;
    }

    // Drawing primitives with clean diagram / sketchy annotation split
    function drawCleanRect(x, y, w, h, radius = 6, strokeColor = '#1e1e1e', fillColor = null) {
      ctx.save();
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(x, y, w, h, radius);
      } else {
        ctx.rect(x, y, w, h);
      }
      if (fillColor) {
        ctx.fillStyle = fillColor;
        ctx.fill();
      }
      ctx.lineWidth = 1.8;
      ctx.strokeStyle = strokeColor;
      ctx.stroke();
      ctx.restore();
    }

    function drawCleanLine(x1, y1, x2, y2, color = '#1e1e1e', width = 2, dash = []) {
      ctx.save();
      ctx.beginPath();
      ctx.setLineDash(dash);
      ctx.lineWidth = width;
      ctx.strokeStyle = color;
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.restore();
    }

    function drawHandwrittenText(text, x, y, size = 14, color = '#1e1e1e', align = 'left', angleDeg = 0) {
      ctx.save();
      ctx.translate(x, y);
      if (angleDeg !== 0) {
        ctx.rotate((angleDeg * Math.PI) / 180);
      }
      ctx.font = `${size}px 'Caveat', 'Segoe Print', 'Comic Sans MS', cursive, sans-serif`;
      ctx.fillStyle = color;
      ctx.textAlign = align;
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 0, 0);
      ctx.restore();
    }

    function drawSketchyButton(id, label, x, y, w, h, isActive, isAccent = false) {
      const isHovered = state.hoveredBtn === id;
      const bg = isActive ? (isAccent ? '#e03131' : '#1971c2') : (isHovered ? '#f1f3f5' : '#ffffff');
      const textColor = isActive ? '#ffffff' : '#1e1e1e';
      const borderColor = isActive ? (isAccent ? '#c92a2a' : '#1864ab') : (isHovered ? '#495057' : '#adb5bd');

      drawCleanRect(x, y, w, h, 6, borderColor, bg);
      
      ctx.save();
      ctx.font = `500 13px system-ui, -apple-system, sans-serif`;
      ctx.fillStyle = textColor;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, x + w / 2, y + h / 2);
      ctx.restore();

      registerBox(id, x, y, w, h);
    }

    function drawLockIcon(x, y, isLocked, size = 20, color = '#2f9e44') {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 2;

      // Lock body
      const bw = size;
      const bh = size * 0.75;
      const bx = x - bw / 2;
      const by = y - bh / 2 + size * 0.2;
      ctx.fillRect(bx, by, bw, bh);

      // Shackle
      ctx.beginPath();
      const sr = size * 0.35;
      if (isLocked) {
        ctx.arc(x, by, sr, Math.PI, 0, false);
      } else {
        ctx.arc(x - 3, by, sr, Math.PI * 1.1, 0, false);
      }
      ctx.stroke();

      // Keyhole
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x, by + bh / 2 - 2, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawKeyIcon(x, y, color = '#f08c00') {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x - 6, y, 5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x - 1, y);
      ctx.lineTo(x + 8, y);
      ctx.lineTo(x + 8, y + 4);
      ctx.moveTo(x + 4, y);
      ctx.lineTo(x + 4, y + 3);
      ctx.stroke();
      ctx.restore();
    }

    function drawEavesdropper(x, y, size = 30) {
      ctx.save();
      // Eye body
      ctx.strokeStyle = '#e03131';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(x, y, size, size * 0.55, 0, 0, Math.PI * 2);
      ctx.stroke();

      // Pupil
      ctx.fillStyle = '#e03131';
      ctx.beginPath();
      ctx.arc(x, y, size * 0.28, 0, Math.PI * 2);
      ctx.fill();

      // Glint
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x - 3, y - 3, size * 0.08, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Main Draw & Layout Loop
    function render(time) {
      if (!state.lastTimestamp) state.lastTimestamp = time;
      const dt = Math.min((time - state.lastTimestamp) / 1000, 0.1);
      state.lastTimestamp = time;

      // Update packet position animation
      if (state.isTransmitting) {
        state.packetPos += dt * 0.45 * state.packetDirection;
        if (state.packetPos >= 1) {
          state.packetPos = 1;
          state.packetDirection = -1; // Echo back response
        } else if (state.packetPos <= 0 && state.packetDirection === -1) {
          state.packetPos = 0;
          state.packetDirection = 1;
          state.isTransmitting = false;
        }
      }

      // Dynamic Resizing & Clear
      const w = rect.width;
      const h = rect.height;

      ctx.clearRect(0, 0, w, h);
      clearBoxes();

      // Layout Geometry Allocations
      const topZoneH = Math.max(65, h * 0.14);
      const bottomZoneH = Math.max(80, h * 0.18);
      const mainZoneY = topZoneH;
      const mainZoneH = h - topZoneH - bottomZoneH;

      // --- ZONE 1: TOP BOARD (Overview & Mode Selector) ---
      const titleY = topZoneH * 0.35;
      ctx.save();
      ctx.font = 'bold 18px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = '#1e1e1e';
      ctx.textAlign = 'left';
      ctx.fillText('HTTPS: Interactive Data Protection Flow', 18, titleY);
      ctx.restore();

      const subtitleY = titleY + 20;
      drawHandwrittenText(
        state.protocol === 'HTTPS'
          ? 'okay so: client encrypts message with shared key → network sees noise → server decrypts!'
          : 'warning: HTTP sends plaintext! Anyone eavesdropping on router/Wi-Fi reads raw data.',
        18,
        subtitleY,
        15,
        state.protocol === 'HTTPS' ? '#2f9e44' : '#e03131',
        'left',
        -0.5
      );

      // Protocol Mode Toggle Buttons (Top Right)
      const btnW = 85;
      const btnH = 28;
      const toggleY = 14;
      const httpsBtnX = w - btnW - 18;
      const httpBtnX = httpsBtnX - btnW - 8;

      drawSketchyButton('btn_http', 'HTTP (Plain)', httpBtnX, toggleY, btnW, btnH, state.protocol === 'HTTP', true);
      drawSketchyButton('btn_https', 'HTTPS (TLS)', httpsBtnX, toggleY, btnW, btnH, state.protocol === 'HTTPS', false);

      // --- ZONE 2: MAIN DIAGRAM (Client, Untrusted Network, Web Server) ---
      const clientX = Math.max(70, w * 0.15);
      const serverX = w - clientX;
      const networkX = w * 0.5;
      const nodeY = mainZoneY + mainZoneH * 0.45;
      const boxWidth = Math.min(130, w * 0.18);
      const boxHeight = Math.min(110, mainZoneH * 0.55);

      // 1. Connection Line / Channel
      const lineY = nodeY;
      const pathLeft = clientX + boxWidth / 2;
      const pathRight = serverX - boxWidth / 2;

      // Main line
      drawCleanLine(pathLeft, lineY, pathRight, lineY, '#868e96', 2.5, state.protocol === 'HTTP' ? [6, 4] : []);

      // If HTTPS, draw TLS/SSL Shielded Tunnel effect
      if (state.protocol === 'HTTPS') {
        ctx.save();
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(47, 158, 68, 0.2)';
        ctx.lineWidth = 28;
        ctx.lineCap = 'round';
        ctx.moveTo(pathLeft, lineY);
        ctx.lineTo(pathRight, lineY);
        ctx.stroke();

        ctx.strokeStyle = '#2f9e44';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.restore();
      }

      // --- NODE 1: BROWSER / CLIENT ---
      const clientLeft = clientX - boxWidth / 2;
      const clientTop = nodeY - boxHeight / 2;
      drawCleanRect(clientLeft, clientTop, boxWidth, boxHeight, 8, '#1e1e1e', '#f8f9fa');
      registerBox('node_client', clientLeft, clientTop, boxWidth, boxHeight);

      // Client Icon & Text
      ctx.save();
      ctx.font = '600 14px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = '#1e1e1e';
      ctx.textAlign = 'center';
      ctx.fillText('Client (Browser)', clientX, clientTop + 22);

      // Laptop Graphic simple representation
      const lapY = clientTop + 50;
      ctx.strokeStyle = '#495057';
      ctx.lineWidth = 2;
      ctx.strokeRect(clientX - 18, lapY - 12, 36, 22);
      ctx.beginPath();
      ctx.moveTo(clientX - 26, lapY + 12);
      ctx.lineTo(clientX + 26, lapY + 12);
      ctx.stroke();
      ctx.restore();

      // Inline Node Role Callout (Client)
      drawHandwrittenText(
        '(originates request)',
        clientX,
        clientTop + boxHeight - 14,
        13,
        '#495057',
        'center'
      );

      // --- NODE 2: NETWORK / EAVESDROPPER ---
      const eavesdropperY = nodeY - 38;
      drawEavesdropper(networkX, eavesdropperY, 22);
      registerBox('node_eavesdropper', networkX - 30, eavesdropperY - 20, 60, 40);

      // Network Node Label
      drawHandwrittenText(
        'Public Wi-Fi / ISP / Routers',
        networkX,
        nodeY + 32,
        14,
        '#1e1e1e',
        'center',
        0
      );

      // Callout for Eavesdropper
      const eavesdropperNote = state.protocol === 'HTTPS' 
        ? '"Eavesdropper Eve sees scrambled noise!"' 
        : '"Eavesdropper Eve steals raw plaintext!"';
      const eavesColor = state.protocol === 'HTTPS' ? '#2f9e44' : '#e03131';
      drawHandwrittenText(eavesdropperNote, networkX, eavesdropperY - 26, 14, eavesColor, 'center', -1);

      // Leader line to eavesdropper
      drawCleanLine(networkX, eavesdropperY - 14, networkX, eavesdropperY - 8, eavesColor, 1, [2, 2]);

      // --- NODE 3: WEB SERVER ---
      const serverLeft = serverX - boxWidth / 2;
      const serverTop = nodeY - boxHeight / 2;
      drawCleanRect(serverLeft, serverTop, boxWidth, boxHeight, 8, '#1e1e1e', '#f8f9fa');
      registerBox('node_server', serverLeft, serverTop, boxWidth, boxHeight);

      // Server Icon & Text
      ctx.save();
      ctx.font = '600 14px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = '#1e1e1e';
      ctx.textAlign = 'center';
      ctx.fillText('Web Server', serverX, serverTop + 22);

      // Server Rack Graphic
      const srvY = serverTop + 50;
      ctx.strokeStyle = '#495057';
      ctx.lineWidth = 1.8;
      ctx.strokeRect(serverX - 18, srvY - 14, 36, 12);
      ctx.strokeRect(serverX - 18, srvY + 2, 36, 12);
      ctx.fillStyle = '#2f9e44';
      ctx.beginPath();
      ctx.arc(serverX + 10, srvY - 8, 2, 0, Math.PI * 2);
      ctx.arc(serverX + 10, srvY + 8, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Inline Node Role Callout (Server)
      drawHandwrittenText(
        '(holds private key)',
        serverX,
        serverTop + boxHeight - 14,
        13,
        '#495057',
        'center'
      );

      // Security Badges / Key Indicators
      if (state.protocol === 'HTTPS') {
        drawLockIcon(clientLeft + 18, clientTop + 20, true, 16, '#2f9e44');
        drawLockIcon(serverLeft + 18, serverTop + 20, true, 16, '#2f9e44');
        drawKeyIcon(clientX - 10, lapY + 30, '#f08c00');
        drawKeyIcon(serverX - 10, srvY + 30, '#f08c00');
      } else {
        drawLockIcon(clientLeft + 18, clientTop + 20, false, 16, '#e03131');
        drawLockIcon(serverLeft + 18, serverTop + 20, false, 16, '#e03131');
      }

      // --- ANIMATED DATA PACKET IN TRANSIT ---
      const activePayload = state.payloads[state.payloadIdx].raw;
      const encryptedText = simulateEncrypt(activePayload);

      // Position along line
      const currPacketX = pathLeft + (pathRight - pathLeft) * state.packetPos;
      const currPacketY = lineY;

      // Determine contents based on location & protocol
      let visibleText = activePayload;
      let packetBg = '#fff3bf';
      let packetBorder = '#f08c00';

      if (state.protocol === 'HTTPS') {
        // Encrypted on wire, decrypted at endpoints
        if (state.packetPos > 0.08 && state.packetPos < 0.92) {
          visibleText = encryptedText;
          packetBg = '#d3f9d8';
          packetBorder = '#2f9e44';
        } else {
          visibleText = activePayload;
          packetBg = '#e7f5ff';
          packetBorder = '#1971c2';
        }
      } else {
        // Plaintext always
        visibleText = activePayload;
        packetBg = '#ffe3e3';
        packetBorder = '#e03131';
      }

      // Draw Data Packet
      const pWidth = Math.max(110, ctx.measureText(visibleText).width + 24);
      const pHeight = 32;
      const pLeft = currPacketX - pWidth / 2;
      const pTop = currPacketY - pHeight / 2;

      ctx.save();
      // Drop shadow for floating packet
      ctx.shadowColor = 'rgba(0,0,0,0.12)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetY = 3;
      drawCleanRect(pLeft, pTop, pWidth, pHeight, 6, packetBorder, packetBg);
      ctx.restore();

      registerBox('data_packet', pLeft, pTop, pWidth, pHeight);

      // Packet Text
      ctx.save();
      ctx.font = 'bold 12px monospace';
      ctx.fillStyle = '#1e1e1e';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(visibleText, currPacketX, currPacketY);
      ctx.restore();

      // Direction Indicator Arrow
      const arrowDir = state.packetDirection;
      ctx.save();
      ctx.fillStyle = packetBorder;
      ctx.beginPath();
      if (arrowDir > 0) {
        ctx.moveTo(pLeft + pWidth + 3, currPacketY);
        ctx.lineTo(pLeft + pWidth - 4, currPacketY - 5);
        ctx.lineTo(pLeft + pWidth - 4, currPacketY + 5);
      } else {
        ctx.moveTo(pLeft - 3, currPacketY);
        ctx.lineTo(pLeft + 4, currPacketY - 5);
        ctx.lineTo(pLeft + 4, currPacketY + 5);
      }
      ctx.fill();
      ctx.restore();

      // --- ZONE 3: SCATTERED KEY PRINCIPLES (Budgeted: Max 4) ---
      // Note 1: Symmetric Key concept (Bottom left under Client)
      const note1X = clientX;
      const note1Y = clientTop + boxHeight + 28;
      if (!isOverlapping(note1X - 70, note1Y, 140, 30)) {
        drawHandwrittenText(
          state.protocol === 'HTTPS' ? '1. Session key encrypts data' : '1. No key used (Plain text!)',
          note1X,
          note1Y,
          13,
          state.protocol === 'HTTPS' ? '#1971c2' : '#e03131',
          'center',
          1
        );
        drawCleanLine(note1X, note1Y - 8, note1X, clientTop + boxHeight + 4, '#868e96', 1, [2, 2]);
        registerBox('note_1', note1X - 70, note1Y - 10, 140, 20);
      }

      // Note 2: Eavesdropper vulnerability (Above network router)
      const note2X = networkX;
      const note2Y = nodeY + 52;
      if (!isOverlapping(note2X - 100, note2Y, 200, 30)) {
        drawHandwrittenText(
          state.protocol === 'HTTPS' ? '2. Routers only see cipher garbage' : '2. Routers can inspect & log raw passwords',
          note2X,
          note2Y,
          13,
          state.protocol === 'HTTPS' ? '#2f9e44' : '#e03131',
          'center',
          -1
        );
        drawCleanLine(note2X, note2Y - 8, note2X, nodeY + 42, '#868e96', 1, [2, 2]);
        registerBox('note_2', note2X - 100, note2Y - 10, 200, 20);
      }

      // Note 3: Decryption at destination (Bottom right under Server)
      const note3X = serverX;
      const note3Y = serverTop + boxHeight + 28;
      if (!isOverlapping(note3X - 70, note3Y, 140, 30)) {
        drawHandwrittenText(
          state.protocol === 'HTTPS' ? '3. Only Server key decrypts' : '3. Server receives plain text',
          note3X,
          note3Y,
          13,
          state.protocol === 'HTTPS' ? '#1971c2' : '#e03131',
          'center',
          1
        );
        drawCleanLine(note3X, note3Y - 8, note3X, serverTop + boxHeight + 4, '#868e96', 1, [2, 2]);
        registerBox('note_3', note3X - 70, note3Y - 10, 140, 20);
      }

      // --- ZONE 4: BOTTOM CONTROL BAR ---
      const ctrlBarY = h - bottomZoneH + 10;
      const ctrlBarH = bottomZoneH - 20;

      // Divider line above controls
      drawCleanLine(18, ctrlBarY - 10, w - 18, ctrlBarY - 10, '#e9ecef', 1);

      // Label
      ctx.save();
      ctx.font = '500 13px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = '#495057';
      ctx.textAlign = 'left';
      ctx.fillText('Payload Selector:', 18, ctrlBarY + 16);
      ctx.restore();

      // Payload selector buttons
      const payloadBtnW = Math.min(110, (w * 0.45) / 3);
      const payloadBtnH = 28;
      let startPx = 135;

      state.payloads.forEach((p, idx) => {
        const px = startPx + idx * (payloadBtnW + 8);
        drawSketchyButton(`btn_payload_${idx}`, p.label, px, ctrlBarY + 3, payloadBtnW, payloadBtnH, state.payloadIdx === idx, false);
      });

      // Transmit Action Button (Right Side)
      const sendBtnW = Math.min(140, w * 0.22);
      const sendBtnH = 34;
      const sendBtnX = w - sendBtnW - 18;
      const sendBtnY = ctrlBarY + 1;

      const sendBtnLabel = state.isTransmitting ? 'Transmitting...' : 'Send Packet ➔';
      drawSketchyButton('btn_send', sendBtnLabel, sendBtnX, sendBtnY, sendBtnW, sendBtnH, state.isTransmitting, true);

      // Interactive Hint
      drawHandwrittenText(
        'click "Send Packet" or change Payload to observe live ciphertext conversion',
        w / 2,
        ctrlBarY + ctrlBarH - 8,
        13,
        '#868e96',
        'center'
      );

      // Trigger animation frame loop
      requestAnimationFrame(render);
    }

    // Dynamic Scaling Handler
    function handleResize() {
      const b = root.getBoundingClientRect();
      rect.width = Math.max(320, b.width);
      rect.height = Math.max(400, b.height);

      dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      canvas.style.width = `${rect.width}px`;
      canvas.style.height = `${rect.height}px`;

      ctx.scale(dpr, dpr);
    }

    // Pointer Interaction Engine
    function getPointerPos(e) {
      const r = canvas.getBoundingClientRect();
      return {
        x: e.clientX - r.left,
        y: e.clientY - r.top
      };
    }

    function handlePointerMove(e) {
      const pos = getPointerPos(e);
      let foundHover = null;

      for (const b of boxes) {
        if (pos.x >= b.x && pos.x <= b.r && pos.y >= b.y && pos.y <= b.b) {
          if (b.id.startsWith('btn_')) {
            foundHover = b.id;
            break;
          }
        }
      }

      state.hoveredBtn = foundHover;
      canvas.style.cursor = foundHover ? 'pointer' : 'default';
    }

    function handlePointerDown(e) {
      const pos = getPointerPos(e);

      for (const b of boxes) {
        if (pos.x >= b.x && pos.x <= b.r && pos.y >= b.y && pos.y <= b.b) {
          if (b.id === 'btn_http') {
            state.protocol = 'HTTP';
          } else if (b.id === 'btn_https') {
            state.protocol = 'HTTPS';
          } else if (b.id.startsWith('btn_payload_')) {
            const idx = parseInt(b.id.replace('btn_payload_', ''), 10);
            state.payloadIdx = idx;
          } else if (b.id === 'btn_send') {
            state.isTransmitting = true;
            state.packetPos = 0;
            state.packetDirection = 1;
          }
        }
      }
    }

    // Setup Listeners
    canvas.addEventListener('pointermove', handlePointerMove);
    canvas.addEventListener('pointerdown', handlePointerDown);
    canvas.addEventListener('pointerleave', () => {
      state.hoveredBtn = null;
    });

    const observer = new ResizeObserver(() => {
      handleResize();
    });
    observer.observe(root);

    // Initial trigger
    handleResize();
    requestAnimationFrame(render);
  })();
  </script>
</div>
